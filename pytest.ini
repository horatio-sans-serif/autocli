[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (will download and use real LLM model)
    integration: marks tests as integration tests
    unit: marks tests as unit tests

addopts = 
    -v
    --strict-markers
    -m "not slow"

# To run slow tests: pytest -m slow
# To run all tests: pytest -m ""
# To run only fast tests: pytest (default)